kind = "web"
previewPath = "/"
title = "Pre-Med Portfolio"
version = "1.0.0"
id = "artifacts/premed-portfolio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21949

[services.development]
run = "pnpm --filter @workspace/premed-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/premed-portfolio", "run", "build" ]
publicDir = "artifacts/premed-portfolio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21949"
BASE_PATH = "/"
